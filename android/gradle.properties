# Only what this library needs for its OWN builds (running its unit tests in
# isolation). Inside a consuming app the root project supplies the toolchain and
# `newArchEnabled`, and build.gradle's safeExtGet reads it from there — a library
# that pinned compileSdk/AGP here would fight the app that consumes it.
#
# The JVM args matter on CI: the Android SDK's own Gradle build (sdk/android) had
# a daemon crash from the default heap, and this module shares those runners.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
